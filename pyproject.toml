[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-vitals"
dynamic = ["version"]
description = "OpenTelemetry tracing + Prometheus RED metrics for FastAPI (route templates, OpenMetrics exemplars, dual sync/async observers)."
readme = "README.md"
# Floor is 3.10 because fastapi>=0.133 and starlette>=1.3 both require it.
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Spencer Livingston", email = "spencer@spencercmd.com" },
]
keywords = [
    "fastapi",
    "opentelemetry",
    "prometheus",
    "metrics",
    "tracing",
    "observability",
    "red",
    "openmetrics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    # Low floors so consumers can pin their own OTEL stack without forced bumps.
    # FastAPI >=0.133.0 is the first release compatible with Starlette 1.x;
    # starlette>=1.3.0 is required for known Starlette security fixes.
    "fastapi>=0.133.0,<1.0",
    "starlette>=1.3.0,<2",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
]

[project.optional-dependencies]
# Optional client auto-instrumentation (see setup_tracing instrument= /
# OTEL_INSTRUMENTATIONS). Floors match opentelemetry-instrumentation-fastapi.
httpx = ["opentelemetry-instrumentation-httpx>=0.40b0"]
requests = ["opentelemetry-instrumentation-requests>=0.40b0"]
sqlalchemy = ["opentelemetry-instrumentation-sqlalchemy>=0.40b0"]
redis = ["opentelemetry-instrumentation-redis>=0.40b0"]
otel-instrumentations = [
    "opentelemetry-instrumentation-httpx>=0.40b0",
    "opentelemetry-instrumentation-requests>=0.40b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.40b0",
    "opentelemetry-instrumentation-redis>=0.40b0",
]
test = [
    "pytest>=9.0.3",
    "httpx>=0.27.0",
    "opentelemetry-instrumentation-httpx>=0.40b0",
    "opentelemetry-instrumentation-requests>=0.40b0",
    "pytest-benchmark>=4.0.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pyright>=1.1.390",
]

[project.urls]
Homepage = "https://github.com/spencercmd/fastapi-vitals"
Repository = "https://github.com/spencercmd/fastapi-vitals"
Issues = "https://github.com/spencercmd/fastapi-vitals/issues"
Changelog = "https://github.com/spencercmd/fastapi-vitals/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/fastapi_vitals/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_vitals"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "scripts",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
]

[tool.pytest.ini_options]
addopts = "--benchmark-disable"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "C90",
]
ignore = [
    "E501",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["fastapi_vitals"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
